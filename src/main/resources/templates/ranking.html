<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head}">
    <title>Ranking - Jardín de la Esperanza</title>
</head>
<body>
<nav th:replace="~{fragments/base :: navbar}"></nav>

<div class="container my-5" style="padding-top: 100px;">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-primary">

            <i class="fas fa-trophy me-3"></i>

            Ranking de Usuarios

        </h1>
        <p class="lead text-muted">Los usuarios que más regalos han recibido</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div th:if="${#lists.isEmpty(ranking)}" class="alert alert-info text-center">
                <i class="fas fa-info-circle me-2"></i>
                No hay datos
            </div>

            <div th:unless="${#lists.isEmpty(ranking)}">

                <div th:each="usuario, iterStat : ${ranking}"

                     class="card mb-3 shadow-sm card-hover border-0"
                     th:classappend="${iterStat.index == 0} ? 'border-warning' : (${iterStat.index == 1} ? 'border-secondary' : (${iterStat.index == 2} ? 'border-dark' : ''))">

                    <div class="card-body">

                        <div class="row align-items-center">

                            <div class="col-md-2 text-center">
                                <div th:if="${iterStat.index == 0}"

                                     class="badge bg-warning text-dark fs-3 rounded-circle p-3">
                                    <i class="fas fa-crown"></i>
                                    <div class="small">1°</div>
                                </div>
                                <div th:if="${iterStat.index == 1}"

                                     class="badge bg-secondary text-white fs-3 rounded-circle p-3">
                                    <i class="fas fa-medal"></i>

                                    <div class="small">2°</div>
                                </div>
                                <div th:if="${iterStat.index == 2}"

                                     class="badge bg-dark text-white fs-3 rounded-circle p-3">
                                    <i class="fas fa-award"></i>

                                    <div class="small">3°</div>
                                </div>
                                <div th:if="${iterStat.index > 2}"

                                     class="badge bg-primary text-white fs-4 rounded-circle p-2">
                                    <span th:text="${iterStat.index + 1} + '°'"></span>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <h5 class="card-title mb-1" th:text="${usuario.nombre + ' ' + usuario.apellido}"></h5>
                                <p class="card-text text-muted mb-1">

                                    <i class="fas fa-envelope me-1"></i>
                                    <span th:text="${usuario.correo}"></span>
                                </p>
                                <p class="card-text small" th:text="${usuario.descripcion}"></p>
                            </div>

                            <div class="col-md-4 text-center">

                                <div th:classappend="${iterStat.index == 0} ? 'ranking-card' : 'bg-primary'"
                                     class="badge fs-5 px-4 py-3 rounded-pill">
                                    <i class="fas fa-gift me-2"></i>
                                    <span th:text="${usuario.totalRegalos}"></span>
                                    <span th:text="${usuario.totalRegalos == 1} ? ' regalo' : ' regalos'"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="text-center mt-4">

        <a href="/" class="btn btn-outline-primary btn-lg px-4 py-2 rounded-pill">
            <i class="fas fa-home me-2"></i>
            Volver al Inicio
        </a>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
